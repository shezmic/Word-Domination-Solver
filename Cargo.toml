[workspace]
members = ["solver", "protocol", "tools/gaddag_compiler"]
resolver = "2"

# Optimize release builds for maximum performance
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Development profile with faster compile times
[profile.dev]
opt-level = 0
debug = true

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
tokio = { version = "1.35", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
rayon = "1.8"
memmap2 = "0.9"
tracing = "0.1"
thiserror = "1.0"
