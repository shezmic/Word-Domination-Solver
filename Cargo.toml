[workspace]
members = ["solver", "protocol", "tools/gaddag_compiler"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
tokio = { version = "1.35", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
rayon = "1.8"
memmap2 = "0.9"
tracing = "0.1"
thiserror = "1.0"
